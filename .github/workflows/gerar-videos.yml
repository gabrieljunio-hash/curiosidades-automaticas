name: Gerar 5 vídeos de curiosidades

on:
  workflow_dispatch:
    inputs:
      temas:
        description: "Informe exatamente 5 temas, um por linha"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gerar-videos-curiosidades
  cancel-in-progress: false

jobs:
  gerar:
    env:
      MPT_HOME: ${{ github.workspace }}/.mpt
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mpt

      - name: Preparar configuração e os cinco temas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TEMAS: ${{ inputs.temas }}
        run: python preparar_lote.py

      - name: Gerar os vídeos
        run: |
          mpt cli --batch-file tasks.json \
            --video-language pt-BR \
            --video-aspect 9:16 \
            --video-source pexels \
            --voice-name pt-BR-FranciscaNeural \
            --video-clip-duration 4 \
            --video-fit-mode cover \
            --subtitle-enabled \
            --subtitle-position bottom \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --font-size 58 \
            --stroke-width 2 \
            --bgm-type random \
            --bgm-volume 0.10 \
            --n-threads 2 \
            --video-script-prompt "Escreva em português brasileiro um roteiro original para vídeo curto de curiosidade, com gancho forte nos primeiros 3 segundos, explicação clara, ritmo envolvente e fechamento que incentive comentários. Duração aproximada de 45 a 60 segundos. Use fatos verificáveis, não invente dados, datas ou fontes. Evite introduções genéricas e não use listas numeradas."

      - name: Disponibilizar vídeos para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-de-curiosidades
          path: |
            .mpt/storage/tasks/
          if-no-files-found: warn
          retention-days: 7
