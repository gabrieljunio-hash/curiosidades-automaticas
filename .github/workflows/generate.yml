name: Gerar 1 vídeo (Gemini + Pixabay)

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Digite o tema do vídeo (deixe vazio para usar a sugestão)"
        required: false
        type: string
        default: "Curiosidades surpreendentes sobre o oceano"

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar MoneyPrinterTurbo oficial
        run: |
          python -m pip install --upgrade pip
          python -m pip install mpt

      - name: Conferir chaves necessárias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Falta cadastrar o segredo GEMINI_API_KEY."
            exit 1
          fi
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "Falta cadastrar o segredo PIXABAY_API_KEY."
            exit 1
          fi

      - name: Gerar um vídeo
        env:
          TEMA: ${{ inputs.tema }}
          MPT_HOME: ${{ github.workspace }}/mpt-data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p "$MPT_HOME"
          cat > "$MPT_HOME/config.toml" <<EOF
          [app]
          video_source = "pixabay"
          pixabay_api_keys = ["$PIXABAY_API_KEY"]
          llm_provider = "gemini"
          gemini_api_key = "$GEMINI_API_KEY"

          [ui]
          subtitle_provider = "edge"
          voice_name = "pt-BR-AntonioNeural"
          EOF

          TEMA="${TEMA:-Curiosidades surpreendentes sobre o oceano}"
          echo "Iniciando geração de um vídeo sobre: $TEMA"
          mpt cli \
            --video-subject "$TEMA" \
            --video-language "pt-BR" \
            --video-aspect "9:16" \
            --video-source "pixabay" \
            --video-count 1 \
            --voice-name "pt-BR-AntonioNeural" \
            --bgm-type random \
            --stop-at video

      - name: Disponibilizar vídeo para baixar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-de-curiosidade
          path: mpt-data/storage/tasks/**/final-*.mp4
          if-no-files-found: warn
          retention-days: 7
